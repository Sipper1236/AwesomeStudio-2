name: macOS build

on:
  push:
    branches:
      - main
      - codex/awesomestudio-core-daw
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=${{ steps.qt.outputs['qt-root-dir'] }}"

      - name: Build Release app
        run: cmake --build build --config Release --parallel

      - name: Locate app bundle
        run: |
          app_path="$(find build -maxdepth 4 -type d -name AwesomeStudio.app -print -quit)"
          if [ -z "$app_path" ]; then
            echo "CMake did not produce AwesomeStudio.app"
            exit 1
          fi
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Deploy Qt runtime
        run: >-
          "${{ steps.qt.outputs['qt-root-dir'] }}/bin/macdeployqt"
          "$APP_PATH"

      - name: Package portable app
        run: |
          cp README.md LICENSE third_party/VST3-SDK-LICENSE.txt "$APP_PATH/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" AwesomeStudio-macOS.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v6
        with:
          name: AwesomeStudio-macOS-arm64
          path: AwesomeStudio-macOS.zip
          if-no-files-found: error
          retention-days: 30
