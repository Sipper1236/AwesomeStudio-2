name: Windows build

on:
  push:
    branches:
      - main
      - codex/awesomestudio-core-daw
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          "-DCMAKE_PREFIX_PATH=${{ steps.qt.outputs['qt-root-dir'] }}"

      - name: Build Release executable
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        run: >-
          & "${{ steps.qt.outputs['qt-root-dir'] }}\bin\windeployqt.exe"
          --release --no-translations build\Release\AwesomeStudio.exe

      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build\Release\* dist -Recurse -Force
          Copy-Item LICENSE, README.md, third_party\VST3-SDK-LICENSE.txt dist
          Compress-Archive -Path dist\* -DestinationPath AwesomeStudio-Windows-x64.zip -CompressionLevel Optimal

      - name: Upload Windows executable and portable app
        uses: actions/upload-artifact@v6
        with:
          name: AwesomeStudio-Windows-x64
          path: |
            build/Release/AwesomeStudio.exe
            AwesomeStudio-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
