name: Linux build

on:
  push:
    branches:
      - main
      - codex/awesomestudio-core-daw
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-multimedia-dev \
            libasound2-dev \
            liblilv-dev \
            libflac-dev \
            libsndfile1-dev \
            libmp3lame-dev \
            librsvg2-bin \
            rpm

      - name: Configure Release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux executable
        run: cmake --build build --parallel

      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB --verbose

      - name: Build RPM package
        run: cpack --config build/CPackConfig.cmake -G RPM --verbose

      - name: Build AppImage
        run: |
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            --output linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          appdir="AppDir"
          mkdir -p "$appdir/usr/bin" \
            "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/scalable/apps"
          install -Dm755 build/AwesomeStudio "$appdir/usr/bin/AwesomeStudio"
          cp packaging/linux/awesome-studio.desktop "$appdir/usr/share/applications/"
          cp packaging/linux/awesome-studio.svg "$appdir/usr/share/icons/hicolor/scalable/apps/"
          rsvg-convert --width 256 --height 256 packaging/linux/awesome-studio.svg \
            --output "$appdir/awesome-studio.png"

          APPIMAGE_EXTRACT_AND_RUN=1 \
          QMAKE=/usr/bin/qmake6 \
          LINUXDEPLOY_OUTPUT_APP_NAME=AwesomeStudio \
          LINUXDEPLOY_OUTPUT_VERSION=0.2.0 \
          LDAI_OUTPUT=AwesomeStudio-x86_64.AppImage \
            ./linuxdeploy-x86_64.AppImage \
              --appdir "$appdir" \
              --desktop-file "$appdir/usr/share/applications/awesome-studio.desktop" \
              --icon-file "$appdir/awesome-studio.png" \
              --plugin qt \
              --output appimage

      - name: Package Linux build archive
        run: |
          package_dir="dist/AwesomeStudio-Linux-x86_64"
          mkdir -p "$package_dir"
          install -Dm755 build/AwesomeStudio "$package_dir/AwesomeStudio"
          cp LICENSE README.md third_party/VST3-SDK-LICENSE.txt "$package_dir/"
          cat > "$package_dir/RUNNING.txt" <<'EOF'
          Awesome Studio Linux x86_64 build

          This is a dynamically linked build made on Ubuntu 24.04. It requires
          Qt 6 Widgets and Multimedia plus ALSA, Lilv, FLAC, libsndfile, and
          LAME runtime libraries. Install the matching runtime packages from
          your Linux distribution, then run ./AwesomeStudio.

          Projects and audio media are not included in this archive.
          EOF
          tar -czf AwesomeStudio-Linux-x86_64.tar.gz -C dist AwesomeStudio-Linux-x86_64

      - name: Upload Linux executable and archive
        uses: actions/upload-artifact@v6
        with:
          name: AwesomeStudio-Linux-x86_64
          path: |
            build/AwesomeStudio
            AwesomeStudio-Linux-x86_64.tar.gz
            awesome-studio_0.2.0_amd64.deb
            awesome-studio-0.2.0-1.x86_64.rpm
            AwesomeStudio-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
